name: CI

on:
  push:
    branches: [main, develop, 'phase/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: refconcept_test
          POSTGRES_USER: refconcept
          POSTGRES_PASSWORD: refconcept
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U refconcept"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, gd, zip, bcmath, intl, pcntl
          coverage: pcov
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: refconcept_test
          DB_USERNAME: refconcept
          DB_PASSWORD: refconcept
        run: php artisan migrate --force

      - name: Static analysis (PHPStan/Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Code style (Pint)
        run: ./vendor/bin/pint --test

      # The committed contract must still match the router. A specification nobody verifies
      # is wrong the first time somebody adds a route, and an integrator finds out first.
      - name: OpenAPI freeze
        run: php artisan refconcept:openapi --check

      - name: Tests (Pest)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: refconcept_test
          DB_USERNAME: refconcept
          DB_PASSWORD: refconcept
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test --parallel

  frontend:
    name: Frontend (Nuxt workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Design token guard
        run: node scripts/check-design-tokens.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Component tests for the shared design system. A Playwright journey exercises these
      # rules incidentally and tells you nothing about why one broke.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/php/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  frontend-images:
    name: Frontend images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [storefront, seller-portal, admin-panel]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/nuxt/Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Composer audit
        working-directory: apps/api
        run: composer audit --no-interaction || true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high || true
