# RefConcept API — nginx in front of PHP-FPM, in production.
#
# Separate from default.conf rather than shared with it, because two of the differences
# below would be actively wrong in development: `$document_root` here is a path baked into
# this image, and the timeouts are sized for a render that takes three minutes rather than
# for somebody waiting to see whether their change worked.
#
# TLS is not terminated here. Coolify's proxy holds the certificate and speaks plain HTTP to
# this container over a private network, which is why the forwarded headers below matter:
# without them Laravel would generate `http://` links and see the proxy's address as the
# client's, and every rate limit would count the whole internet as one visitor.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # A room photograph is capped at 25 MB by the application. This sits above that so the
    # refusal comes from the validator, with a sentence somebody can read, rather than from
    # nginx with an empty body and a 413.
    client_max_body_size 40M;
    client_body_timeout 120s;

    # Off, because it names the version. A patch level is a shopping list for anybody
    # scanning for one.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This host answers JSON to three Nuxt origins and nothing else. A page that cannot load
    # a script, a style or a frame is a page that cannot be turned into one.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Answered here rather than in PHP: the health probe runs every few seconds forever, and
    # booting a framework to say "the process is up" is a boot per probe. The real check —
    # database, pgvector, cache, queue, storage, migrations — is /api/health and goes to PHP.
    location = /up-nginx {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # What the browser actually asked for, as opposed to what reached this container.
        # Laravel trusts these only from the proxies named in TrustProxies.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        include fastcgi_params;

        # A synchronous AI call — a search rewrite, a plan — can take a minute. Renders and
        # films run on the queue and never come through here, so this does not need to cover
        # them; it needs to be longer than the slowest thing a person waits for.
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Dotfiles, `.env` and `.git` included, except the ACME challenge directory.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
    }
}
