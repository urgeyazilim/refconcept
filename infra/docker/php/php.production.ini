; RefConcept PHP — production overrides
;
; Loaded after 99-refconcept.ini, so anything here wins. Kept separate rather than folded in
; because the development file is read by people working on the code and the two settings
; that matter most below would be actively harmful there.

; The source never changes inside a running container: a deploy is a new image, not an edit.
; Checking every file's mtime on every request buys nothing and costs a stat per include.
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Interned strings and a larger file cache, sized for a framework plus the vendor tree.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000

; Cuts a `file_exists` on every include for paths PHP has already resolved.
opcache.enable_file_override = 1

; A render can take three minutes and the AI worker runs on the CLI, where this does not
; apply. For a web request, anything past a minute is a request nobody is still waiting for.
max_execution_time = 60

; A room photograph is capped at 25 MB by the application; the ceilings here sit above that
; so the refusal comes from the validator, with a sentence somebody can read, rather than
; from PHP with an empty request body.
upload_max_filesize = 32M
post_max_size = 40M

; Never on a server. An exception page carries file paths, environment values and query
; fragments, and the customer who triggered it is the one person who must not see them.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off
