; RefConcept PHP runtime defaults
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 32M
post_max_size = 40M
date.timezone = UTC

; Money and financial correctness: never rely on float string conversion defaults.
precision = 17
serialize_precision = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
