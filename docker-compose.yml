# RefConcept — local development stack
# Owns: PostgreSQL(+pgvector), Redis, S3-compatible storage, mail catcher, Laravel API.
# Nuxt apps run on the host (see Makefile / scripts) and are containerised for CI/production
# via their own Dockerfiles. Rationale: docs/ADR/ADR-0002-local-dev-topology.md

name: refconcept

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: refconcept-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-refconcept}
      POSTGRES_USER: ${DB_USERNAME:-refconcept}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-refconcept}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_PORT_HOST:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-refconcept} -d ${DB_DATABASE:-refconcept}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [refconcept]

  redis:
    image: redis:7-alpine
    container_name: refconcept-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT_HOST:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [refconcept]

  minio:
    image: minio/minio:latest
    container_name: refconcept-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-refconcept}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-refconcept-secret}
    ports:
      - "${MINIO_PORT_HOST:-59000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-59001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [refconcept]

  minio-init:
    image: minio/mc:latest
    container_name: refconcept-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-refconcept} ${AWS_SECRET_ACCESS_KEY:-refconcept-secret} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-refconcept-private} &&
      mc mb --ignore-existing local/${AWS_PUBLIC_BUCKET:-refconcept-public} &&
      mc anonymous set download local/${AWS_PUBLIC_BUCKET:-refconcept-public} &&
      echo 'minio buckets ready'
      "
    networks: [refconcept]

  mailpit:
    image: axllent/mailpit:latest
    container_name: refconcept-mailpit
    restart: unless-stopped
    ports:
      - "${MAIL_PORT_HOST:-51025}:1025"
      - "${MAIL_UI_PORT_HOST:-58025}:8025"
    networks: [refconcept]

  api:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: refconcept-api
    restart: unless-stopped
    working_dir: /var/www/html
    # No env_file here on purpose: Laravel reads .env from the synced source volume.
    # Injecting it as real process environment would override PHPUnit's test values
    # and point the suite at the development database.
    volumes:
      - api-app:/var/www/html
      - api-vendor:/var/www/html/vendor
    # `docker compose watch` mirrors host edits into the container filesystem.
    # One-shot equivalent: scripts/rc.ps1 sync  /  make sync
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /var/www/html
          ignore:
            - vendor/
            - node_modules/
            - storage/logs/
            - storage/framework/cache/
            - bootstrap/cache/
        - action: sync+restart
          path: ./apps/api/.env
          target: /var/www/html/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [refconcept]

  nginx:
    image: nginx:1.27-alpine
    container_name: refconcept-nginx
    restart: unless-stopped
    ports:
      - "${API_PORT_HOST:-58000}:80"
    volumes:
      - api-app:/var/www/html:ro
      - api-vendor:/var/www/html/vendor:ro
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks: [refconcept]

  queue:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: refconcept-queue
    restart: unless-stopped
    working_dir: /var/www/html
    # No env_file here on purpose: Laravel reads .env from the synced source volume.
    # Injecting it as real process environment would override PHPUnit's test values
    # and point the suite at the development database.
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=1"]
    volumes:
      - api-app:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [refconcept]

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    container_name: refconcept-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # No env_file here on purpose: Laravel reads .env from the synced source volume.
    # Injecting it as real process environment would override PHPUnit's test values
    # and point the suite at the development database.
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - api-app:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      api:
        condition: service_started
    networks: [refconcept]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  # PHP dependencies live in a named volume: writing thousands of files through a
  # Windows bind mount is orders of magnitude slower and times composer out (ADR-0002).
  api-vendor:
  # Application source is synced into a named volume rather than bind-mounted:
  # a Laravel boot costs 22.8s over the Windows bind mount versus 2.5s on the
  # container filesystem. Sync with `scripts/rc.ps1 sync` or `docker compose watch`.
  api-app:

networks:
  refconcept:
    driver: bridge
